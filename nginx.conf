server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tiap rute di-prerender jadi folder ("produk/index.html", dst.), jadi
    # request tanpa trailing slash (mis. "/produk") kena redirect otomatis
    # nginx untuk menambah "/". Server ini duduk di belakang reverse-proxy
    # (gateway host) yang men-terminate TLS dan tidak diketahui nginx di sini
    # (dia cuma tahu dirinya sendiri: http di port 8080) — tanpa baris ini,
    # redirect itu jadi absolute URL yang membocorkan skema/port internal,
    # mis. "http://www.jamuin.co:8080/produk/" alih-alih "/produk/" relatif.
    # Ini berlaku untuk SEMUA rute, karena semua link internal situs
    # (Navbar/Footer/Link) ditulis tanpa trailing slash.
    absolute_redirect off;

    # Setiap rute sudah di-prerender jadi index.html sendiri (lihat scripts/prerender.mjs),
    # try_files ini cuma jaring pengaman untuk path yang belum ke-generate.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Asset dengan hash di nama file (dari Vite build) aman di-cache lama.
    location ~* \.(?:js|css|woff2?|avif|webp|jpg|jpeg|png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Security headers di level app; header sensitif ke TLS/HSTS ditangani gateway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    error_page 404 /index.html;
}
